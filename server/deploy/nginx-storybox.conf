# 故事机后端对外入口：https://story.example.com:38800（把 story.example.com 换成你的域名，端口可改）
# 证书用 certbot 为该域名签发的 Let's Encrypt 证书（续期后 deploy hook 重载 nginx 即可生效）
server {
    listen 38800 ssl;
    listen [::]:38800 ssl;
    http2 on;
    server_name story.example.com;

    ssl_certificate /etc/letsencrypt/live/story.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/story.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 照片上传 ≤1 MiB（multipart 略大）
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:38801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
