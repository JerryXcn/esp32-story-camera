<!doctype html>
<meta charset="utf-8">
<!-- UI 线性图标源（24x24 viewBox，圆头圆角线 2.3）。render_icons.py 用无头 Chrome 渲染后取 alpha 生成 A8 图标。
     新增图标：在 ICONS 里加一项（名称 + SVG 内容），重新运行 render_icons.py 和 convert_assets.py。 -->
<style>
  html,body{margin:0;background:transparent}
  #grid{display:flex;flex-wrap:wrap;width:1920px}
  svg{width:192px;height:192px;fill:none;stroke:#000;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#000;stroke:none}
</style>
<div id="grid"></div>
<script>
const ICONS = {
  home:   '<path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/><path d="M10 19.5v-5h4v5"/>',
  camera: '<rect x="3" y="7" width="18" height="13" rx="3.5"/><path d="M8.5 7 10 4.5h4L15.5 7"/><circle cx="12" cy="13.5" r="3.6"/>',
  books:  '<rect x="3.5" y="4" width="5" height="16" rx="1.3"/><rect x="9.5" y="6.5" width="5" height="13.5" rx="1.3"/><path d="m15.6 8.1 3.3-.9 2.7 12-3.3.9z"/><path d="M5.5 8h1M11.5 10h1"/>',
  back:   '<path d="M14.5 5 7.5 12l7 7"/>',
  next:   '<path d="M9.5 5l7 7-7 7"/>',

  replay: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/>',
  more:   '<circle class="f" cx="6" cy="12" r="1.8"/><circle class="f" cx="12" cy="12" r="1.8"/><circle class="f" cx="18" cy="12" r="1.8"/>',

  wifi_off:'<path d="M5.5 12.3a9.5 9.5 0 0 1 6-2.8M8.6 15.5a5 5 0 0 1 4.5-1.4M2.5 9a14 14 0 0 1 6.5-3.6"/><circle class="f" cx="12" cy="19" r="1.3"/><path d="M15 9.5l6 6M21 9.5l-6 6"/>',

};
const g = document.getElementById("grid");
for (const [k, v] of Object.entries(ICONS)) {
  g.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 24 24" data-name="${k}">${v}</svg>`);
}
document.title = Object.keys(ICONS).join(",");
</script>
